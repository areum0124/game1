<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>닌텐도 레트로 테트리스</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      /* 업로드하신 배경 이미지를 전체 화면에 적용 */
      background: url('bg.png') no-repeat center center fixed;
      background-size: cover;
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* 게임 전체를 감싸는 반투명 유리 느낌의 컨테이너 */
    .container {
      display: flex;
      gap: 20px;
      background: rgba(20, 20, 20, 0.75); /* 반투명 검은색 배경 */
      backdrop-filter: blur(8px);          /* 배경 블러 효과 */
      padding: 25px;
      border-radius: 15px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.8);
    }

    .game-board-container {
      position: relative;
    }

    /* 테트리스 게임판 (Canvas) */
    #tetris {
      border: 3px solid #ff4757; /* 레트로 느낌의 붉은 테두리 */
      background-color: rgba(0, 0, 0, 0.85);
      display: block;
      border-radius: 4px;
      box-shadow: 0 0 15px rgba(255, 71, 87, 0.3);
    }

    /* 오른쪽 정보 및 버튼 사이드바 */
    .sidebar {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-width: 160px;
    }

    .info-box {
      background: rgba(40, 40, 40, 0.8);
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 12px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .info-box h2 {
      font-size: 13px;
      color: #eccc68; /* 레트로 골드 컬러 */
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .info-box p {
      font-size: 22px;
      font-weight: bold;
      color: #70a1ff;
    }

    .controls-info {
      background: rgba(30, 30, 30, 0.8);
      padding: 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.6;
      color: #ddd;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .controls-info h3 {
      color: #2ed573;
      margin-bottom: 6px;
      font-size: 14px;
    }

    /* 시작 버튼 (닌텐도 스타일 RED) */
    #start-btn {
      background-color: #ff4757;
      color: #fff;
      border: none;
      padding: 12px;
      font-size: 15px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.4);
      margin-top: 10px;
    }

    #start-btn:hover {
      background-color: #ff6b81;
      transform: translateY(-2px);
    }

    #start-btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="game-board-container">
      <canvas id="tetris" width="240" height="400"></canvas>
    </div>

    <div class="sidebar">
      <div>
        <div class="info-box">
          <h2>점수</h2>
          <p id="score">0</p>
        </div>
        <div class="info-box">
          <h2>레벨</h2>
          <p id="level">1</p>
        </div>
        <div class="info-box">
          <h2>지운 줄 수</h2>
          <p id="lines">0</p>
        </div>
      </div>

      <div class="controls-info">
        <h3>조작 방법</h3>
        <p>← / → : 좌우 이동</p>
        <p>↓ : 빠르게 내리기</p>
        <p>↑ : 회전</p>
        <p>스페이스바 : 즉시 떨어뜨리기</p>
      </div>

      <button id="start-btn">게임 시작 / 재시작</button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('tetris');
    const context = canvas.getContext('2d');
    const scoreElement = document.getElementById('score');
    const levelElement = document.getElementById('level');
    const linesElement = document.getElementById('lines');
    const startBtn = document.getElementById('start-btn');

    // 240x400 Canvas 기준 (12열 20행 => 1칸당 20px)
    context.scale(20, 20);

    // 테트리스 블록 네온 색상
    const colors = [
      null,
      '#ff4757', // T (Red)
      '#00d2d3', // I (Cyan)
      '#2ed573', // S (Green)
      '#ff6b81', // Z (Pink)
      '#ffa502', // L (Orange)
      '#1e90ff', // J (Blue)
      '#eccc68'  // O (Yellow)
    ];

    function createPiece(type) {
      if (type === 'I') {
        return [
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
          [0, 1, 0, 0],
        ];
      } else if (type === 'L') {
        return [
          [0, 2, 0],
          [0, 2, 0],
          [0, 2, 2],
        ];
      } else if (type === 'J') {
        return [
          [0, 3, 0],
          [0, 3, 0],
          [3, 3, 0],
        ];
      } else if (type === 'O') {
        return [
          [4, 4],
          [4, 4],
        ];
      } else if (type === 'Z') {
        return [
          [5, 5, 0],
          [0, 5, 5],
          [0, 0, 0],
        ];
      } else if (type === 'S') {
        return [
          [0, 6, 6],
          [6, 6, 0],
          [0, 0, 0],
        ];
      } else if (type === 'T') {
        return [
          [0, 7, 0],
          [7, 7, 7],
          [0, 0, 0],
        ];
      }
    }

    function createMatrix(w, h) {
      const matrix = [];
      while (h--) {
        matrix.push(new Array(w).fill(0));
      }
      return matrix;
    }

    let arena = createMatrix(12, 20);

    const player = {
      pos: {x: 0, y: 0},
      matrix: null,
      score: 0,
      lines: 0,
      level: 1,
    };

    function collide(arena, player) {
      const m = player.matrix;
      const o = player.pos;
      for (let y = 0; y < m.length; ++y) {
        for (let x = 0; x < m[y].length; ++x) {
          if (m[y][x] !== 0 &&
             (arena[y + o.y] && arena[y + o.y][x + o.x]) !== 0) {
            return true;
          }
        }
      }
      return false;
    }

    function merge(arena, player) {
      player.matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            arena[y + player.pos.y][x + player.pos.x] = value;
          }
        });
      });
    }

    function arenaSweep() {
      let rowCount = 1;
      let clearedLines = 0;

      outer: for (let y = arena.length - 1; y > 0; --y) {
        for (let x = 0; x < arena[y].length; ++x) {
          if (arena[y][x] === 0) {
            continue outer;
          }
        }

        const row = arena.splice(y, 1)[0].fill(0);
        arena.unshift(row);
        ++y;

        player.score += rowCount * 10;
        rowCount *= 2;
        clearedLines++;
      }

      if (clearedLines > 0) {
        player.lines += clearedLines;
        player.level = Math.floor(player.lines / 10) + 1;
        dropInterval = Math.max(100, 1000 - (player.level - 1) * 100);
      }
    }

    function draw() {
      context.fillStyle = 'rgba(0, 0, 0, 0.85)';
      context.fillRect(0, 0, canvas.width, canvas.height);

      drawMatrix(arena, {x: 0, y: 0});
      drawMatrix(player.matrix, player.pos);
    }

    function drawMatrix(matrix, offset) {
      matrix.forEach((row, y) => {
        row.forEach((value, x) => {
          if (value !== 0) {
            context.fillStyle = colors[value];
            context.fillRect(x + offset.x, y + offset.y, 1, 1);
            
            context.strokeStyle = '#111';
            context.lineWidth = 0.05;
            context.strokeRect(x + offset.x, y + offset.y, 1, 1);
          }
        });
      });
    }

    function rotate(matrix, dir) {
      for (let y = 0; y < matrix.length; ++y) {
        for (let x = 0; x < y; ++x) {
          [matrix[x][y], matrix[y][x]] = [matrix[y][x], matrix[x][y]];
        }
      }
      if (dir > 0) {
        matrix.forEach(row => row.reverse());
      } else {
        matrix.reverse();
      }
    }

    function playerMove(offset) {
      player.pos.x += offset;
      if (collide(arena, player)) {
        player.pos.x -= offset;
      }
    }

    function playerReset() {
      const pieces = 'TJLOSZI';
      player.matrix = createPiece(pieces[pieces.length * Math.random() | 0]);
      player.pos.y = 0;
      player.pos.x = (arena[0].length / 2 | 0) - (player.matrix[0].length / 2 | 0);

      if (collide(arena, player)) {
        alert("게임 오버! 최종 점수: " + player.score);
        arena.forEach(row => row.fill(0));
        player.score = 0;
        player.lines = 0;
        player.level = 1;
        dropInterval = 1000;
        updateScore();
      }
    }

    function playerDrop() {
      player.pos.y++;
      if (collide(arena, player)) {
        player.pos.y--;
        merge(arena, player);
        playerReset();
        arenaSweep();
        updateScore();
      }
      dropCounter = 0;
    }

    function playerHardDrop() {
      while (!collide(arena, player)) {
        player.pos.y++;
      }
      player.pos.y--;
      merge(arena, player);
      playerReset();
      arenaSweep();
      updateScore();
      dropCounter = 0;
    }

    function playerRotate(dir) {
      const pos = player.pos.x;
      let offset = 1;
      rotate(player.matrix, dir);
      while (collide(arena, player)) {
        player.pos.x += offset;
        offset = -(offset + (offset > 0 ? 1 : -1));
        if (offset > player.matrix[0].length) {
          rotate(player.matrix, -dir);
          player.pos.x = pos;
          return;
        }
      }
    }

    function updateScore() {
      scoreElement.innerText = player.score;
      levelElement.innerText = player.level;
      linesElement.innerText = player.lines;
    }

    let dropCounter = 0;
    let dropInterval = 1000;
    let lastTime = 0;
    let isRunning = false;

    function update(time = 0) {
      if (!isRunning) return;

      const deltaTime = time - lastTime;
      lastTime = time;

      dropCounter += deltaTime;
      if (dropCounter > dropInterval) {
        playerDrop();
      }

      draw();
      requestAnimationFrame(update);
    }

    document.addEventListener('keydown', event => {
      if (!isRunning) return;

      if (event.keyCode === 37) {
        playerMove(-1);
      } else if (event.keyCode === 39) {
        playerMove(1);
      } else if (event.keyCode === 40) {
        playerDrop();
      } else if (event.keyCode === 38) {
        playerRotate(1);
      } else if (event.keyCode === 32) {
        event.preventDefault();
        playerHardDrop();
      }
    });

    startBtn.addEventListener('click', () => {
      arena.forEach(row => row.fill(0));
      player.score = 0;
      player.lines = 0;
      player.level = 1;
      dropInterval = 1000;
      updateScore();
      playerReset();
      
      if (!isRunning) {
        isRunning = true;
        update();
      }
    });
  </script>
</body>
</html>
